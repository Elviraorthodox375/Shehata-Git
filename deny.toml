# Dependency policy for `cargo deny`, enforced in CI.
#
# This project routes GitHub credentials, so a dependency carrying a known
# vulnerability is a real problem rather than a housekeeping annoyance. The
# settings below are tuned to make that signal audible instead of drowning it
# in findings this project cannot act on.

[advisories]
# A known vulnerability fails the build. This is the default and stays.
yanked = "deny"

# Only flag an unmaintained crate when it is one this workspace chose.
#
# Tauri pulls in the GTK3 bindings for its Linux backend, and those are
# archived upstream — ten `unmaintained` findings that this project cannot fix,
# for code that never ships in the Windows and macOS builds. Treating them as
# failures would mean the check is permanently red, which is the same as having
# no check at all.
unmaintained = "workspace"

ignore = []

[licenses]
# Permissive licences only. The project ships as MIT, and a copyleft dependency
# would change what users may do with the binaries they download.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
    "OpenSSL",
]
confidence-threshold = 0.9

[bans]
# Duplicate versions are unavoidable in a Tauri tree and are not a security
# issue by themselves, so they are reported rather than fatal.
multiple-versions = "warn"

# A versionless dependency on a published crate would accept anything the
# registry serves, so it is refused.
wildcards = "deny"
# ...but this workspace's own crates reference each other by path and have no
# version by design. Those are not registry pulls and carry no such risk.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
