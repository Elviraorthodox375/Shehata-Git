name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  quality:
    name: Windows quality gate
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # Tauri validates every configured external binary while compiling the
      # desktop crate. Build the real sidecars in a clean checkout first.
      - name: Prepare Tauri sidecars
        run: pnpm prepare:sidecars

      # Tauri embeds frontendDist while compiling the desktop crate, so build
      # the web assets before the Rust workspace in a clean checkout.
      - name: Frontend lint
        run: pnpm --filter @shehata/desktop lint

      - name: Frontend type check
        run: pnpm --filter @shehata/desktop typecheck

      - name: Frontend tests
        run: pnpm --filter @shehata/desktop test

      - name: Frontend production build
        run: pnpm --filter @shehata/desktop build

      - name: Rust formatting
        run: cargo fmt --all -- --check

      - name: Rust lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --workspace
