name: Bug report
description: Something is not working
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! **Never paste tokens, passwords, or full auth headers here.**
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead?
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Safe diagnostics
      description: Paste only the report from Settings → Copy diagnostic report. Do not paste raw `shehata doctor --json` output because it can contain local installation paths.
      render: text
  - type: input
    id: version
    attributes:
      label: Shehata Git version
      placeholder: 0.1.6
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11 24H2
  - type: checkboxes
    id: safety
    attributes:
      label: Sensitive-data check
      options:
        - label: I removed tokens, private remote URLs, repository contents, and personal paths from this report.
          required: true
