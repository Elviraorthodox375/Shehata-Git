<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!--
    Shehata Git mark.
    An "S" trunk carries identity nodes; two source lines converge from the
    left into the single correct path — multiple identities, one repository.
    Recognizable at 16x16: keep strokes >= 3 units in the 64-unit grid.
  -->
  <g stroke="#55DDB9" stroke-linecap="round">
    <!-- converging identity lines -->
    <path d="M11 12 L23 21.5" stroke-width="3"/>
    <path d="M11 26 L20 27.5" stroke-width="3"/>
    <!-- S trunk -->
    <path d="M44 18.5 C36.5 11.5 21.5 13 20.5 23 C19.5 33 45 31.5 45 42 C45 52.5 28 55.5 20 46"
          stroke-width="6"/>
  </g>
  <!-- source identity nodes -->
  <circle cx="11" cy="12" r="3.6" fill="#55DDB9"/>
  <circle cx="11" cy="26" r="3.6" fill="#55DDB9"/>
  <!-- trunk nodes: identities riding the correct path -->
  <circle cx="20.5" cy="23" r="4.2" fill="#0B0D10" stroke="#55DDB9" stroke-width="2.6"/>
  <circle cx="45" cy="42" r="4.2" fill="#0B0D10" stroke="#2ECF9F" stroke-width="2.6"/>
</svg>
