[package]
name = "shehata-desktop"
description = "Shehata Git desktop application"
version.workspace = true
# Distributed as signed application installers, never as a crates.io
# package. Marking it explicitly also stops an accidental publish.
publish = false
edition.workspace = true
license.workspace = true

[lib]
name = "shehata_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "shehata-git"
path = "src/main.rs"

[dependencies]
shehata-core = { path = "../../../crates/shehata-core" }
shehata-github = { path = "../../../crates/shehata-github" }
shehata-storage = { path = "../../../crates/shehata-storage" }

tauri = { version = "2.11", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
which = "8"

tokio = { workspace = true, features = ["process"] }

[build-dependencies]
tauri-build = { version = "2.6", features = [] }
